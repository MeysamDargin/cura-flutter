allprojects {
    repositories {
        // maven { url 'https://mirror-maven.runflare.com/android/maven2/' }
        // maven { url 'https://mirror-maven.runflare.com/maven2/' }
        // maven { url 'https://mirror-maven.runflare.com/gradle-plugins/' }
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (namespace == null) {
                    namespace project.group
                }
            }
        }
    }
}
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android {
                ndkVersion "29.0.13113456"
                compileSdkVersion 36
                if (project.android.hasProperty("namespace") == false) {
                    namespace project.group.toString()
                }
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(":app")
}


tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

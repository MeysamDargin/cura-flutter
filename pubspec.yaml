name: cura
description: Cura is a dark, glass-styled AI companion for conversation, history, and guided wellness.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  liquid_glass_widgets: ^1.10.0
  supabase_flutter: ^2.14.2
  video_player: ^2.11.1
  vibration: ^3.2.0
  http: ^1.6.0
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/video/

  fonts:
    - family: nova
      fonts:
        - asset: assets/fonts/ProximaNovaRegular.ttf
    - family: nova-bold
      fonts:
        - asset: assets/fonts/ProximaNovaBold.ttf
    - family: nova-black
      fonts:
        - asset: assets/fonts/ProximaNovaBlack.ttf
